name: Daily Pachi Scraper

on:
  workflow_dispatch:
  schedule:
    - cron: '0 15 * * *' # 毎日日本時間24:00実行

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run Scrapers
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SITE7_COOKIE: ${{ secrets.SITE7_COOKIE }}
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
        run: |
          node dmm_scraper.js || true
          node pachi_scraper.js || true
          node site7_scraper.js || true
